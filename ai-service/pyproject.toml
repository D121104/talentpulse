[project]
name = "talentpulse-ai-service"
version = "0.1.0"
description = "FastAPI AI sidecar for CV matching, retrieval, and grounded generation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "qdrant-client>=1.19,<2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
qdrant-admin = "app.qdrant_admin:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
files = ["app"]
