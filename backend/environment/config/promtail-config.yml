server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nestjs_backend_file
    static_configs:
      - targets:
          - localhost
        labels:
          job: talentpulse-backend-file
          service: talentpulse-backend
          __path__: /var/log/talentpulse/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            context: context
            reqId: reqId
            msg: msg
            time: time
      - template:
          source: level
          template: '{{ if eq .Value "60" }}fatal{{ else if eq .Value "50" }}error{{ else if eq .Value "40" }}warn{{ else if eq .Value "30" }}info{{ else if eq .Value "20" }}debug{{ else if eq .Value "10" }}trace{{ else }}{{ .Value }}{{ end }}'
      - labels:
          level:
      - timestamp:
          source: time
          format: UnixMs
          fallback_formats:
            - RFC3339Nano
            - RFC3339
          action_on_failure: skip

  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_id']
        regex: '.+'
        replacement: 'docker'
        target_label: 'job'
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{job="docker"} |~ "^\\s*\\{"'
          stages:
            - json:
                expressions:
                  level: level
            - template:
                source: level
                template: '{{ if eq .Value "60" }}fatal{{ else if eq .Value "50" }}error{{ else if eq .Value "40" }}warn{{ else if eq .Value "30" }}info{{ else if eq .Value "20" }}debug{{ else if eq .Value "10" }}trace{{ else }}{{ .Value }}{{ end }}'
            - labels:
                level:
