<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pulseLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="radarLightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- ICON PHẦN BIỂU TƯỢNG -->
  <g transform="translate(6, 6)">
    <!-- Vòng tròn radar ngoài cùng -->
    <circle cx="26" cy="26" r="23" stroke="#CBD5E1" stroke-width="2.5" />
    
    <!-- Vòng tròn radar trung tâm -->
    <circle cx="26" cy="26" r="15" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6 4" />
    
    <!-- Quét radar góc 45 độ -->
    <path d="M 26 26 L 42 10 A 23 23 0 0 0 26 3 Z" fill="url(#radarLightBeam)" />
    <line x1="26" y1="26" x2="42" y2="10" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />

    <!-- Điểm hội tụ trung tâm -->
    <circle cx="26" cy="26" r="5" fill="#2563EB" />
    <circle cx="26" cy="26" r="2" fill="#FFFFFF" />

    <!-- Các node tín hiệu xung quanh -->
    <circle cx="49" cy="26" r="3" fill="#0284C7" />
    <circle cx="3" cy="26" r="3" fill="#94A3B8" />
    <circle cx="26" cy="49" r="3" fill="#2563EB" />
    <circle cx="26" cy="3" r="3" fill="#0284C7" />
  </g>

  <!-- TYPOGRAPHY -->
  <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="25" font-weight="800" fill="#0F172A" letter-spacing="-0.3">
    TALENT<tspan fill="url(#pulseLightGrad)">PULSE</tspan>
  </text>
  
  <text x="69" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="2">
    INTELLIGENT RECRUITMENT
  </text>
</svg>
