name: talentpulse-demo

services:
  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/origin-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    init: true
    entrypoint: ["/usr/local/bin/talentpulse-env-loader"]
    command: ["node", "dist/main.js"]
    secrets:
      - backend-env
      - db-ca
      - ai-ca-cert
    environment:
      NODE_ENV: demo
      PORT: "8000"
      DB_PORT: "5432"
      DB_DATABASE: talentpulse_demo
      DB_SYNCHRONIZE: "false"
      REDIS_ENABLED: "true"
      REDIS_TLS: "false"
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      RUN_BACKGROUND_JOBS: "true"
      RUN_INDEXING_WORKER: "true"
      AI_INDEX_ENVIRONMENT: demo
      AI_INDEX_OUTBOX_ENVIRONMENT: demo
      AI_SERVICE_URL: https://ai-service:8000
      AI_SERVICE_JWT_ALGORITHM: RS256
      AI_SERVICE_JWT_TTL_SECONDS: "60"
      AI_SERVICE_TIMEOUT_MS: "10000"
      DB_SSL_CA_FILE: /run/secrets/db-ca
      NODE_EXTRA_CA_CERTS: /run/secrets/ai-ca-cert
    depends_on:
      valkey:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks: [private]
    mem_limit: 2304m
    cpus: 1.25
    pids_limit: 512
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8000/api/v1/health/ready')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  ai-service:
    image: ${AI_SERVICE_IMAGE:?AI_SERVICE_IMAGE is required}
    restart: unless-stopped
    init: true
    entrypoint: ["/usr/local/bin/talentpulse-env-loader"]
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ssl-keyfile
      - /run/secrets/ai-tls-key
      - --ssl-certfile
      - /run/secrets/ai-tls-cert
    secrets:
      - ai-env
      - ai-tls-key
      - ai-tls-cert
    environment:
      AI_ENVIRONMENT: demo
      AI_AUTH_REQUIRED: "true"
      AI_EMBEDDING_PROVIDER: cohere
      AI_VECTOR_STORE_PROVIDER: qdrant
      AI_GENERATION_PROVIDER: bedrock
      AI_COHERE_MODEL: cohere.embed-multilingual-v3
      AI_COHERE_DIMENSIONS: "1024"
      AI_QDRANT_COLLECTION: jobs_cohere_multilingual_v3_1024_demo_v1
      AI_QDRANT_ALIAS: jobs_current_demo
      AI_QDRANT_INDEX_VERSION: demo-v1
      AI_BEDROCK_MODEL: amazon.nova-lite-v1:0
      AI_BEDROCK_REGION: ${AWS_REGION:?AWS_REGION is required}
    networks: [private]
    mem_limit: 1536m
    cpus: 0.75
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import ssl, urllib.request;
          urllib.request.urlopen('https://127.0.0.1:8000/health/ready',
          context=ssl._create_unverified_context(), timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  valkey:
    image: valkey/valkey:8.0.2-alpine
    restart: unless-stopped
    init: true
    command: ["valkey-server", "/run/secrets/valkey-config"]
    secrets:
      - valkey-config
      - valkey-password
    volumes:
      - valkey-data:/data
    networks: [private]
    mem_limit: 512m
    cpus: 0.35
    pids_limit: 128
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          VALKEYCLI_AUTH="$$(cat /run/secrets/valkey-password)"
          valkey-cli --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  private:
    name: talentpulse-demo-private
    driver: bridge

secrets:
  backend-env:
    file: ${TALENTPULSE_RUNTIME_DIR:?TALENTPULSE_RUNTIME_DIR is required}/backend.env
  ai-env:
    file: ${TALENTPULSE_RUNTIME_DIR:?TALENTPULSE_RUNTIME_DIR is required}/ai.env
  db-ca:
    file: ${TALENTPULSE_RUNTIME_DIR:?TALENTPULSE_RUNTIME_DIR is required}/db-ca.pem
  ai-ca-cert:
    file: ${TALENTPULSE_RUNTIME_DIR:?TALENTPULSE_RUNTIME_DIR is required}/ai-ca.crt
  ai-tls-cert:
    file: ${TALENTPULSE_RUNTIME_DIR:?TALENTPULSE_RUNTIME_DIR is required}/ai-tls.crt
  ai-tls-key:
    file: ${TALENTPULSE_RUNTIME_DIR:?TALENTPULSE_RUNTIME_DIR is required}/ai-tls.key
  valkey-config:
    file: ${TALENTPULSE_RUNTIME_DIR:?TALENTPULSE_RUNTIME_DIR is required}/valkey.conf
  valkey-password:
    file: ${TALENTPULSE_RUNTIME_DIR:?TALENTPULSE_RUNTIME_DIR is required}/valkey-password

volumes:
  valkey-data:
    name: talentpulse-demo-valkey
